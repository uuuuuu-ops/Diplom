version: '3.8'

services:

  app:
    build: .
    container_name: diplom-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - mongo
      - rabbitmq

    environment:
      # =====================
      # APP
      # =====================
      SPRING_APPLICATION_NAME: Diplom
      APP_BASE_URL: http://localhost:8080
      APP_UPLOAD_DIR: uploads
      CERTIFICATE_STORAGE_PATH: uploads/certificates

      # =====================
      # DATABASE (MongoDB)
      # =====================
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/diplom

      # =====================
      # REDIS
      # =====================
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # =====================
      # RABBITMQ
      # =====================
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # =====================
      # JWT
      # =====================
      JWT_SECRET: MyVerySecretKeyForJwtToken12345678901234567890
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000

      # =====================
      # MAIL (GMAIL SMTP)
      # =====================
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: rkulzabaj@gmail.com
      SPRING_MAIL_PASSWORD: xfudebxqilqesevf

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST: smtp.gmail.com

      # =====================
      # CLOUDINARY
      # =====================
      CLOUDINARY_CLOUD_NAME: dayol7ol0
      CLOUDINARY_API_KEY: 867562891888512
      CLOUDINARY_API_SECRET: 5YxsRF7Uo7pCsqiEgiU5W40C5fM

      # =====================
      # PAYPAL
      # =====================
      PAYPAL_CLIENT_ID: AVNBl9qgjx46vnoaCpi_4FpeAZp7oqMzmpk73TKDn_mrUMPhzEAno-PLuJCTT7B-TsIaxc0ScipxNExb
      PAYPAL_CLIENT_SECRET: EMXHuJ_EK438Mgm2q2IyfvwRK-4DWrN7TLF0LytHXTuSfNjTUw3pEySy0BHMGerAD27BpIFn3oCDM3F5
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      PAYPAL_SUBSCRIPTION_PLAN_ID: P-58N535868G1027601NHFZDXQ

      # =====================
      # AI SERVICE
      # =====================
      AI_RESUME_API_URL: http://host.docker.internal:8000


  # =====================
  # REDIS
  # =====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  # =====================
  # MONGODB
  # =====================
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    restart: unless-stopped


  # =====================
  # RABBITMQ
  # =====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
