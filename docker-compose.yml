services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  ai-service:
    build:
      context: ./backend/src/main/java/com/diploma/Diplom/Ai
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      AI_RESUME_API_URL: http://ai-service:8000
      APP_ALLOWED_ORIGINS: http://localhost,http://localhost:80
      FRONTEND_BASE_URL: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - ai-service

  frontend:
    container_name: couteach
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "80:80"
    depends_on:
      - backend
