spring.application.name=Diplom
spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.base-url=https://api-m.sandbox.paypal.com
paypal.subscription.plan-id=P-58N535868G1027601NHFZDXQ

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=550MB

app.upload.dir=uploads
app.base-url=http://localhost:8080

certificate.storage.path=uploads/certificates

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.diploma.Diplom=DEBUG



# Swagger UI available at: http://localhost:8080/swagger-ui.html
# OpenAPI JSON spec at:    http://localhost:8080/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Group the endpoints so they appear in logical sections
springdoc.group-configs[0].group=Authentication
springdoc.group-configs[0].paths-to-match=/auth/**

springdoc.group-configs[1].group=Courses
springdoc.group-configs[1].paths-to-match=/courses/**

springdoc.group-configs[2].group=Lessons
springdoc.group-configs[2].paths-to-match=/lessons/**

springdoc.group-configs[3].group=Quizzes
springdoc.group-configs[3].paths-to-match=/quizzes/**,/quiz-attempts/**

springdoc.group-configs[4].group=Progress & Certificates
springdoc.group-configs[4].paths-to-match=/progress/**,/api/certificates/**

springdoc.group-configs[5].group=Enrollments & Payments
springdoc.group-configs[5].paths-to-match=/enrollments/**,/payments/**,/subscriptions/**

springdoc.group-configs[6].group=Teacher Applications
springdoc.group-configs[6].paths-to-match=/teacher-applications/**