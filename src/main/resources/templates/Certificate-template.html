<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Certificate</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }

        .certificate {
            width: 1000px;
            margin: 40px auto;
            background: #ffffff;
            padding: 70px 80px;
            position: relative;
            border: 2px solid #d4af37;
        }

        /* декоративная рамка */
        .certificate::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid #d4af37;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            font-weight: 700;
            color: #111827;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 16px;
            color: #6b7280;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 40px 0;
            font-weight: 600;
            text-align: center;
            color: #111827;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            padding-bottom: 10px;
        }

        .center {
            text-align: center;
        }

        .course {
            font-size: 24px;
            margin-top: 20px;
            color: #374151;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            font-size: 15px;
            color: #374151;
        }

        .left, .right {
            width: 45%;
        }

        .row {
            margin-bottom: 12px;
        }

        .label {
            color: #6b7280;
        }

        .value {
            font-weight: 500;
            color: #111827;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 60px;
        }

        .signature {
            text-align: center;
        }

        .sign-line {
            width: 220px;
            border-top: 1px solid #111;
            margin-bottom: 8px;
        }

        .qr img {
            width: 110px;
            height: 110px;
        }

        .verify {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

    </style>
</head>
<body>

<div class="certificate">

    <div class="header">
        <div class="title">Certificate</div>
        <div class="subtitle">of completion</div>
    </div>

    <div class="center">
        <div>This is to certify that</div>

        <div class="name" th:text="${studentName}">
            Student Name
        </div>

        <div>has successfully completed the course</div>

        <div class="course" th:text="${courseTitle}">
            Course Title
        </div>
    </div>

    <div class="details">
        <div class="left">
            <div class="row">
                <span class="label">Instructor:</span>
                <span class="value" th:text="${instructorName}">Instructor Name</span>
            </div>

            <div class="row">
                <span class="label">Date:</span>
                <span class="value" th:text="${issuedAt}">01.01.2026</span>
            </div>
        </div>

        <div class="right">
            <div class="row">
                <span class="label">Certificate No:</span>
                <span class="value" th:text="${certificateNumber}">CERT-123</span>
            </div>

            <div class="row">
                <span class="label">Verification Code:</span>
                <span class="value" th:text="${verificationCode}">ABC123XYZ</span>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="signature">
            <div class="sign-line"></div>
            <div>Instructor Signature</div>
        </div>

        <div class="qr">
            <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" alt="QR Code"/>
        </div>
    </div>

    <div class="verify">
        Verify at:
        <span th:text="${verificationUrl}">
            http://localhost:8080/api/certificates/verify/code
        </span>
    </div>

</div>

</body>
</html>
